<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>1688 采集</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        color: #111827;
        font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin-bottom: 10px;
        font-size: 12px;
        color: #4b5563;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 10px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #374151;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .section {
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid #e5e7eb;
      }
      #status {
        min-height: 18px;
        margin-top: 10px;
        white-space: pre-wrap;
        color: #4b5563;
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <h1>1688 到 Ozon 采集</h1>
    <div class="section">
      <label>
        后台地址
        <input id="apiBase" value="http://localhost:3000" />
      </label>
      <label>
        后台邮箱
        <input id="email" type="email" value="admin@example.com" />
      </label>
      <label>
        后台密码
        <input id="password" type="password" />
      </label>
      <button id="login" class="secondary">登录后台</button>
    </div>
    <label>
      采集数量
      <input id="limit" type="number" min="1" max="200" value="50" />
    </label>
    <button id="capture">采集当前店铺</button>
    <div id="status"></div>
    <script src="index.js"></script>
  </body>
</html>
