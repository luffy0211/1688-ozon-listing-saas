services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: listing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d listing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        WEB_BASE_IMAGE: ${WEB_BASE_IMAGE:-node:22-bookworm-slim}
    environment:
      DATABASE_URL: postgresql://saas:saas@postgres:5432/listing?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-before-production}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: listing-assets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:9000/listing-assets
      S3_FORCE_PATH_STYLE: "true"
      OZON_API_BASE: https://api-seller.ozon.ru
      ENABLE_REAL_OZON_SUBMIT: ${ENABLE_REAL_OZON_SUBMIT:-false}
      OZON_PRICE_CURRENCY_CODE: ${OZON_PRICE_CURRENCY_CODE:-RUB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      OPENAI_AGENT_MOCK: ${OPENAI_AGENT_MOCK:-true}
      OPENAI_AGENT_TRACE_SENSITIVE_DATA: ${OPENAI_AGENT_TRACE_SENSITIVE_DATA:-false}
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://api.deepseek.com}
      VISION_MODEL: ${VISION_MODEL:-deepseek-flash}
      AGENT_MIN_MARGIN_RATE: ${AGENT_MIN_MARGIN_RATE:-0.25}
      AGENT_MIN_PROFIT_RUB: ${AGENT_MIN_PROFIT_RUB:-100}
      AGENT_COMPETITOR_CACHE_HOURS: ${AGENT_COMPETITOR_CACHE_HOURS:-24}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OZON_CRAWLER_PYTHON: ${OZON_CRAWLER_PYTHON:-python}
      OZON_CRAWLER_SCRIPT: ${OZON_CRAWLER_SCRIPT:-}
      OZON_CRAWLER_COOKIE_JAR: ${OZON_CRAWLER_COOKIE_JAR:-}
      OZON_CRAWLER_COOKIE_TSV: ${OZON_CRAWLER_COOKIE_TSV:-}
      OZON_CRAWLER_PROXY: ${OZON_CRAWLER_PROXY:-}
      OZON_CRAWLER_SCAN_PAGES: ${OZON_CRAWLER_SCAN_PAGES:-5}
      OZON_CRAWLER_TIMEOUT_MS: ${OZON_CRAWLER_TIMEOUT_MS:-900000}
      OZON_CURL_BIN: ${OZON_CURL_BIN:-}
      XIANGJI_API_BASE: https://api.tosoiot.com
      XIANGJI_MOCK: ${XIANGJI_MOCK:-true}
      XIANGJI_AUTH_MODE: ${XIANGJI_AUTH_MODE:-x-api-key}
      XIANGJI_TEXT_MOCK: ${XIANGJI_TEXT_MOCK:-true}
      XIANGJI_PDP_MOCK: ${XIANGJI_PDP_MOCK:-true}
      XIANGJI_USER_KEY: ${XIANGJI_USER_KEY:-}
      XIANGJI_TEXT_TRANS_KEY: ${XIANGJI_TEXT_TRANS_KEY:-}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://saas:saas@postgres:5432/listing?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-before-production}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: listing-assets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:9000/listing-assets
      S3_FORCE_PATH_STYLE: "true"
      OZON_API_BASE: https://api-seller.ozon.ru
      ENABLE_REAL_OZON_SUBMIT: ${ENABLE_REAL_OZON_SUBMIT:-false}
      OZON_PRICE_CURRENCY_CODE: ${OZON_PRICE_CURRENCY_CODE:-RUB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      OPENAI_AGENT_MOCK: ${OPENAI_AGENT_MOCK:-true}
      OPENAI_AGENT_TRACE_SENSITIVE_DATA: ${OPENAI_AGENT_TRACE_SENSITIVE_DATA:-false}
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://api.deepseek.com}
      VISION_MODEL: ${VISION_MODEL:-deepseek-flash}
      OZON_CRAWLER_PYTHON: ${OZON_CRAWLER_PYTHON:-python}
      OZON_CRAWLER_SCRIPT: ${OZON_CRAWLER_SCRIPT:-}
      OZON_CRAWLER_COOKIE_JAR: ${OZON_CRAWLER_COOKIE_JAR:-}
      OZON_CRAWLER_COOKIE_TSV: ${OZON_CRAWLER_COOKIE_TSV:-}
      OZON_CRAWLER_PROXY: ${OZON_CRAWLER_PROXY:-}
      OZON_CRAWLER_SCAN_PAGES: ${OZON_CRAWLER_SCAN_PAGES:-5}
      OZON_CRAWLER_TIMEOUT_MS: ${OZON_CRAWLER_TIMEOUT_MS:-900000}
      OZON_CURL_BIN: ${OZON_CURL_BIN:-}
      XIANGJI_API_BASE: https://api.tosoiot.com
      XIANGJI_MOCK: ${XIANGJI_MOCK:-true}
      XIANGJI_AUTH_MODE: ${XIANGJI_AUTH_MODE:-x-api-key}
      XIANGJI_TEXT_MOCK: ${XIANGJI_TEXT_MOCK:-true}
      XIANGJI_PDP_MOCK: ${XIANGJI_PDP_MOCK:-true}
      XIANGJI_USER_KEY: ${XIANGJI_USER_KEY:-}
      XIANGJI_TEXT_TRANS_KEY: ${XIANGJI_TEXT_TRANS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
