services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: listing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d listing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://saas:saas@postgres:5432/listing?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-before-production}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: listing-assets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:9000/listing-assets
      S3_FORCE_PATH_STYLE: "true"
      OZON_API_BASE: https://api-seller.ozon.ru
      ENABLE_REAL_OZON_SUBMIT: ${ENABLE_REAL_OZON_SUBMIT:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_AGENT_MODEL: ${OPENAI_AGENT_MODEL:-}
      OPENAI_AGENT_MOCK: ${OPENAI_AGENT_MOCK:-true}
      OPENAI_AGENT_TRACE_SENSITIVE_DATA: ${OPENAI_AGENT_TRACE_SENSITIVE_DATA:-false}
      AGENT_MIN_MARGIN_RATE: ${AGENT_MIN_MARGIN_RATE:-0.25}
      AGENT_MIN_PROFIT_RUB: ${AGENT_MIN_PROFIT_RUB:-100}
      AGENT_COMPETITOR_CACHE_HOURS: ${AGENT_COMPETITOR_CACHE_HOURS:-24}
      XIANGJI_API_BASE: https://api.tosoiot.com
      XIANGJI_MOCK: ${XIANGJI_MOCK:-true}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://saas:saas@postgres:5432/listing?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-before-production}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: listing-assets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:9000/listing-assets
      S3_FORCE_PATH_STYLE: "true"
      OZON_API_BASE: https://api-seller.ozon.ru
      ENABLE_REAL_OZON_SUBMIT: ${ENABLE_REAL_OZON_SUBMIT:-false}
      XIANGJI_API_BASE: https://api.tosoiot.com
      XIANGJI_MOCK: ${XIANGJI_MOCK:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
